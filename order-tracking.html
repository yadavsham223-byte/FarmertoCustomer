<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="index.html">Farmer to Customer</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow mx-auto" style="max-width:700px;">

        <div class="card-header bg-success text-white text-center">
            <h2>Track Your Order</h2>
        </div>

        <div class="card-body">

            <form class="mb-4">
                <div class="mb-3">
                    <label class="form-label">Order ID</label>
                    <input type="text" class="form-control"
                           placeholder="Enter Order ID (e.g. ORD101)">
                </div>

                <button type="submit" class="btn btn-success">
                    Track Order
                </button>
            </form>

            <hr>

            <h4 class="text-success">Order Details</h4>

            <table class="table table-bordered">
                <tr>
                    <th>Order ID</th>
                    <td>ORD101</td>
                </tr>

                <tr>
                    <th>Customer</th>
                    <td>Rahul Sharma</td>
                </tr>

                <tr>
                    <th>Product</th>
                    <td>Tomato (5 Kg)</td>
                </tr>

                <tr>
                    <th>Total Amount</th>
                    <td>₹200</td>
                </tr>

                <tr>
                    <th>Order Status</th>
                    <td>
                        <span class="badge bg-primary">
                            Out for Delivery
                        </span>
                    </td>
                </tr>

                <tr>
                    <th>Expected Delivery</th>
                    <td>13-07-2026</td>
                </tr>
            </table>

            <div class="alert alert-success text-center">
                Your order is on the way. Thank you for shopping with us!
            </div>

        </div>

    </div>

</div>

<footer class="bg-success text-white text-center p-3 mt-5">
    <p class="mb-0">
        © 2026 Farmer to Customer | Order Tracking
    </p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
