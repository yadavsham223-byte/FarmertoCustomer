<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Farmer To Customer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
    url("https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1500&q=80");
    background-size:cover;
    background-position:center;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    width:400px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
}

.login-box h2{
    text-align:center;
    color:#2e8b57;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    background:#2e8b57;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}

.links{
    text-align:center;
    margin-top:15px;
}

.links a{
    text-decoration:none;
    color:#2e8b57;
    font-weight:bold;
}

.links a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="login-box">

<h2>🌾 Farmer To Customer Login</h2>

<form>

<label>Login As</label>
<select id="userType" required>
    <option value="">-- Select User Type --</option>
    <option value="customer">Customer</option>
    <option value="farmer">Farmer</option>
    <option value="admin">Admin</option>
</select>

<label>Email</label>
<input type="email" placeholder="Enter Email" required>

<label>Password</label>
<input type="password" placeholder="Enter Password" required>

<button type="button" onclick="loginUser()">Login</button>

</form>

<div class="links">
<p><a href="customer-register.html">Customer Register</a></p>
<p><a href="farmer-register.html">Farmer Register</a></p>
</div>

</div>

<script>
function loginUser(){

    let user = document.getElementById("userType").value;

    if(user=="customer"){
        window.location.href="customer.html";
    }
    else if(user=="farmer"){
        window.location.href="farmer-dashboard.html";
    }
    else if(user=="admin"){
        window.location.href="admin-dashboard.html";
    }
    else{
        alert("Please select a user type.");
    }

}
</script>

</body>
</html>
