<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmer Registration | Farmer To Customer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
    url("https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1500&q=80");
    background-size:cover;
    background-position:center;
}

.container{
    width:450px;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    color:#2e8b57;
    margin-bottom:20px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:10px;
}

input, textarea, select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

textarea{
    resize:none;
    height:70px;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    background:#2e8b57;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}

.login-link{
    text-align:center;
    margin-top:15px;
}

.login-link a{
    color:#2e8b57;
    text-decoration:none;
    font-weight:bold;
}

.login-link a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="container">

<h2>🌾 Farmer Registration</h2>

<form action="farmer-login.html">

<label>Full Name</label>
<input type="text" placeholder="Enter Full Name" required>

<label>Email</label>
<input type="email" placeholder="Enter Email" required>

<label>Mobile Number</label>
<input type="tel" placeholder="Enter Mobile Number" required>

<label>Farm Name</label>
<input type="text" placeholder="Enter Farm Name" required>

<label>Farm Address</label>
<textarea placeholder="Enter Farm Address" required></textarea>

<label>State</label>
<select required>
<option value="">Select State</option>
<option>Maharashtra</option>
<option>Karnataka</option>
<option>Gujarat</option>
<option>Madhya Pradesh</option>
<option>Uttar Pradesh</option>
<option>Rajasthan</option>
</select>

<label>Password</label>
<input type="password" placeholder="Create Password" required>

<label>Confirm Password</label>
<input type="password" placeholder="Confirm Password" required>

<button type="submit">Register</button>

</form>

<div class="login-link">
Already have an account?
<a href="farmer-login.html">Login Here</a>
</div>

</div>

</body>
</html>
