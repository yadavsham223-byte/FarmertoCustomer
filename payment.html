<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="index.html">Farmer to Customer</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow mx-auto" style="max-width:600px;">
        <div class="card-header bg-success text-white text-center">
            <h2>Payment</h2>
        </div>

        <div class="card-body">

            <form action="order.html" method="post">

                <div class="mb-3">
                    <label class="form-label">Customer Name</label>
                    <input type="text" class="form-control" placeholder="Enter your name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mobile Number</label>
                    <input type="tel" class="form-control" placeholder="Enter mobile number" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Delivery Address</label>
                    <textarea class="form-control" rows="3" placeholder="Enter delivery address" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Payment Method</label>
                    <select class="form-select" required>
                        <option selected disabled>Select Payment Method</option>
                        <option>Cash on Delivery (COD)</option>
                        <option>Credit Card</option>
                        <option>Debit Card</option>
                        <option>UPI</option>
                        <option>Net Banking</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Total Amount</label>
                    <input type="text" class="form-control" value="₹500" readonly>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-success">
                        Confirm Payment
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

<footer class="bg-success text-white text-center p-3 mt-5">
    <p class="mb-0">© 2026 Farmer to Customer | Secure Payment</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
